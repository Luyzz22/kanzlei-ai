name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly scan on main (DSGVO Art. 32 / NIS2 Art. 21 continuous monitoring)
    - cron: "0 2 * * *"

permissions:
  contents: read
  actions: read

jobs:
  # ── CodeQL note ────────────────────────────────────────────────────────────
  # GitHub code scanning / Advanced Security is not available for this private
  # personal repository. CodeQL SARIF upload would fail before producing a
  # usable gate. Keep Semgrep, Gitleaks and dependency audit active here.

  # ── Semgrep — Rule-based SAST (audit mode during standalone split) ─────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep audit scan
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/react \
            --config=p/nextjs \
            --sarif-output=semgrep.sarif || true
        env:
          # Optional: authenticate for Pro rules (set SEMGREP_APP_TOKEN as secret)
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # ── Gitleaks — Secret Scanning (current tree, blocking) ─────────────────────
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks current tree scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose \
              --config=/repo/.gitleaks.toml

  # ── Gitleaks — Git-History (report-only, noch nicht blockierend) ────────────
  # Compliance-Handoff A4 verlangt einen History-Scan. Bewusst nicht blockierend
  # gestartet: die History (1296 Commits) ist nie vollständig mit gitleaks
  # geprüft worden. Eine gezielte Suche nach echten Anthropic-/Google-/OpenAI-
  # Key-Formen über alle Refs blieb ohne Treffer, das deckt aber nur einen Teil
  # des Regelsatzes ab. Nach dem ersten grünen Lauf auf `continue-on-error`
  # verzichten und den Job blockierend schalten.
  gitleaks-history:
    name: Gitleaks History Scan (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks history scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose \
              --log-opts="--all" \
              --config=/repo/.gitleaks.toml

  # ── LLM Egress Guard — Phase A1 "Stop the Bleeding" (blocking) ──────────────
  # Friert die Menge direkter Provider-Egress-Punkte ein. Neue Umgehungen des
  # künftigen ModelGateway fallen hier durch; getilgte Alt-Pfade müssen aus der
  # Allowlist entfernt werden, damit die Liste beim Umbau schrumpft.
  llm-egress:
    name: LLM Egress Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for provider egress outside the gateway allowlist
        run: node scripts/check-llm-egress.mjs

      # Dieselbe Deny-Liste existiert in Python (redaction_pipeline) und in
      # TypeScript (Laufzeit). Zwei Kopien einer sicherheitskritischen Liste
      # laufen ohne Zwang auseinander.
      - name: Check deny-term lists stay in sync across Python and TypeScript
        run: node scripts/check-deny-terms-sync.mjs

  # ── Dependency Audit ────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (critical blocks CI; high logged only)
        # Remaining HIGH CVEs in next@14.x all require next@15 (major upgrade, accepted risk).
        # CRITICAL vulnerabilities fail CI; HIGH are logged without failing.
        run: |
          pnpm audit --audit-level=high || true
          pnpm audit --audit-level=critical
